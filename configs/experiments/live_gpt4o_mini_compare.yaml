# LIVE LLM experiment — gpt-4o-mini on fixture corpus/dataset.
# Not a large-benchmark claim; small n for controlled architecture comparison.
experiment_id: live_gpt4o_mini_compare
comparison_mode: unconstrained
retrieval_mode: bm25
top_k: 5
seed: 42
corpus: fixtures/corpus/mini_wiki.jsonl
dataset: fixtures/datasets/mini_eval.jsonl
architectures:
  - rag
  - single_agent
  - multi_agent
model:
  provider: openai
  model_name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 512
budget:
  max_steps: 8
  max_model_calls: 12
  max_docs: 20
  max_tokens: 8000
  max_retrieval_calls: 5
  top_k: 5
tags:
  - live
  - gpt-4o-mini
