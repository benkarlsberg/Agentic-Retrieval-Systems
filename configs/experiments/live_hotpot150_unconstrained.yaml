# LIVE LLM experiment — gpt-4o-mini on HotpotQA distractor stratified slice (~150).
# Multi-hop heavy local BM25 corpus; no web search.
experiment_id: live_hotpot150_unconstrained
comparison_mode: unconstrained
retrieval_mode: bm25
top_k: 5
seed: 42
corpus: fixtures/corpus/hotpot_dev_slice_150.jsonl
dataset: fixtures/datasets/hotpot_dev_slice_150.jsonl
architectures:
  - rag
  - single_agent
  - multi_agent
model:
  provider: openai
  model_name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 512
budget:
  max_steps: 8
  max_model_calls: 12
  max_docs: 20
  max_tokens: 8000
  max_retrieval_calls: 5
  top_k: 5
tags:
  - live
  - gpt-4o-mini
  - hotpot150
  - unconstrained
